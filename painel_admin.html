<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-zinc-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante - Painel de Gestão Avançado</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { orange: { 400: '#fb923c', 500: '#f97316' } } } }
    }
  </script>
</head>
<body class="h-full font-sans text-zinc-100 bg-zinc-950 flex flex-col selection:bg-orange-500 selection:text-white">

  <!-- NAVBAR COM ABAS DE NAVEGAÇÃO -->
  <nav class="bg-zinc-900 border-b border-zinc-800 px-4 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-4">
      <div class="w-9 h-9 bg-orange-500/20 text-orange-400 rounded-xl flex items-center justify-center font-bold border border-orange-500/30">R1</div>
      <h2 class="font-bold text-zinc-100 hidden sm:block">Painel de Gestão</h2>
    </div>

    <!-- ABAS / JANELAS -->
    <div class="flex items-center space-x-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
      <button onclick="switchTab('mesas')" id="tab-btn-mesas" class="px-4 py-2 rounded-lg text-xs font-bold transition bg-orange-500 text-black flex items-center space-x-2">
        <i class="fa-solid fa-chair"></i> <span>Mesas</span>
      </button>
      <button onclick="switchTab('historico')" id="tab-btn-historico" class="px-4 py-2 rounded-lg text-xs font-bold transition text-zinc-400 hover:text-white flex items-center space-x-2">
        <i class="fa-solid fa-clock-rotate-left"></i> <span>Histórico</span>
      </button>
      <button onclick="switchTab('estatisticas')" id="tab-btn-estatisticas" class="px-4 py-2 rounded-lg text-xs font-bold transition text-zinc-400 hover:text-white flex items-center space-x-2">
        <i class="fa-solid fa-chart-pie"></i> <span>Estatísticas</span>
      </button>
    </div>

    <div class="flex items-center space-x-3">
      <div class="relative">
        <button id="waiter-queue-btn" onclick="toggleWaiterQueue()" class="bg-zinc-950 border border-zinc-800 px-3 py-2 rounded-xl text-xs font-medium flex items-center space-x-2">
          <i class="fa-solid fa-bell text-amber-400"></i>
          <span class="hidden md:inline">Fila Garçom</span>
          <span id="waiter-queue-count" class="hidden bg-amber-500 text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <div id="waiter-queue-drawer" class="hidden absolute right-0 mt-2 w-72 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-50 p-2">
            <div id="waiter-queue-list" class="space-y-2"></div>
        </div>
      </div>
      <span id="server-status-badge" class="inline-flex items-center px-2 py-1 rounded text-[10px] font-medium bg-zinc-800 text-rose-400 border border-zinc-700">
        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 me-1 animate-pulse"></span> Offline
      </span>
    </div>
  </nav>

  <main class="flex-1 p-6 overflow-y-auto">
    
    <!-- JANELA 1: MESAS AO VIVO -->
    <div id="view-mesas" class="space-y-4">
      <div id="tables-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>

    <!-- JANELA 2: HISTÓRICO DE PEDIDOS -->
    <div id="view-historico" class="hidden space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-4 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
        <h3 class="font-bold text-white text-sm">Histórico de Comandas Fechadas</h3>
        <div class="flex items-center space-x-2">
          <button onclick="carregarHistorico('dia')" id="btn-hist-dia" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs rounded-xl font-medium transition">Hoje</button>
          <button onclick="carregarHistorico('semana')" id="btn-hist-semana" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs rounded-xl font-medium transition">Últimos 7 Dias</button>
          <button onclick="carregarHistorico('mes')" id="btn-hist-mes" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs rounded-xl font-medium transition">Último Mês</button>
          <button onclick="carregarHistorico('todos')" id="btn-hist-todos" class="px-3 py-1.5 bg-orange-500 text-black text-xs rounded-xl font-bold transition">Todos</button>
        </div>
      </div>

      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-zinc-950 text-zinc-400 text-xs uppercase border-b border-zinc-800">
              <th class="p-3.5">Mesa</th>
              <th class="p-3.5">Comanda</th>
              <th class="p-3.5">Data / Fechamento</th>
              <th class="p-3.5">Valor Total</th>
              <th class="p-3.5 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="historico-table-body" class="divide-y divide-zinc-800 text-xs">
            <tr><td colspan="5" class="p-6 text-center text-zinc-500">A carregar histórico...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- JANELA
